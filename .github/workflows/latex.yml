name: build-paper
on: [push, pull_request]
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf
